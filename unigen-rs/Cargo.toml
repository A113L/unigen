[package]
name = "unigen"
version = "2.0.8"
edition = "2021"
description = "UNIGEN - Unicode Password Utility (Rust Edition)"
default-run = "unigen"

[[bin]]
name = "unigen"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "persistence", "accesskit"] }
egui = "0.28"

# Crypto
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["zeroize"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
# ChaCha20 keystream used only for the lightweight in-memory (RAM-at-rest)
# obfuscation layer in `mem_cipher`/`secret::LockedSecret` — not part of
# the on-disk vault format, which stays AES-256-GCM (see `crypto.rs`).
chacha20 = "0.9"
zeroize = { version = "1.7", features = ["derive"] }

# File dialogs / clipboard
# Default features pull in the xdg-desktop-portal (DBus) backend on
# Linux, which silently hangs forever if no portal service/backend
# (xdg-desktop-portal + xdg-desktop-portal-gtk/-kde) is running — the
# dialog thread never returns, no error, no crash, the window just never
# appears. Switching to the gtk3 backend makes the dialog a normal
# synchronous GTK call instead of a DBus round-trip, so it doesn't
# depend on a portal service being present. No effect on Windows/macOS,
# whose backends aren't gated by these features.
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }
arboard = "3.3"

# Misc
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.22"
hex = "0.4"
env_logger = "0.11"

# Vault (password-manager entry storage)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
