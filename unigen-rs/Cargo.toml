[package]
name = "unigen"
version = "2.0.3"
edition = "2021"
description = "UNIGEN - Unicode Password Utility (Rust Edition)"
default-run = "unigen"

[[bin]]
name = "unigen"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "persistence", "accesskit"] }
egui = "0.28"

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
zeroize = { version = "1.7", features = ["derive"] }

# File dialogs / clipboard
rfd = "0.14"
arboard = "3.3"

# Misc
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.22"
hex = "0.4"
